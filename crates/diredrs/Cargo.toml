[package]
name = "diredrs"
description = "A standalone, cross-platform TUI directory editor with Emacs-style editing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "diredrs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.29.0"
regex = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-width = "=0.2.0"

# Same crate/version crossterm already pulls in; used to peek the Windows
# console input queue so a paste that arrives as individual key events can be
# detected. See `paste.rs`.
[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9.1"
